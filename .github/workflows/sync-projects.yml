name: Sync GitHub projects
on:
  schedule:
    - cron: "30 2 * * *"   # every day, 02:30 UTC
  push:
    branches: [main]
    paths: [".github/workflows/sync-projects.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&sort=updated&direction=desc" \
            | jq '[.[] | {name, full_name, html_url, description, language, topics, stargazers_count, forks_count, fork, archived, pushed_at, updated_at}]' > data/projects.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --cached --quiet || (git commit -m "Sync GitHub projects" && git push)
